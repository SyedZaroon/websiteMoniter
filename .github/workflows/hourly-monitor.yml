name: Hourly website monitor

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check websites and send alerts
        run: python main.py --exit-zero
        env:
          WEBSITE_MONITOR_EMAIL_TO: ${{ secrets.WEBSITE_MONITOR_EMAIL_TO }}
          WEBSITE_MONITOR_SMTP_USERNAME: ${{ secrets.WEBSITE_MONITOR_SMTP_USERNAME }}
          WEBSITE_MONITOR_SMTP_PASSWORD: ${{ secrets.WEBSITE_MONITOR_SMTP_PASSWORD }}
